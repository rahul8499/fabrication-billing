<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>RS Fabrication Billing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: steel top bar + tab rail; work area of lists, editors and a paper preview of each bill */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#f6f7f8; --ink:#1a1e23; --muted:#5b6570; --line:#d8dce0;
  --steel:#262d35; --steel-ink:#eef1f4; --red:#c4161c; --red-soft:#fbe9e9; --on-red:#ffffff;
  --ok:#1f7a45; --ok-soft:#e3f3e9; --warn:#a15c00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --paper:#ffffff; --paper-ink:#141414; --paper-muted:#555; --paper-band:#e6e6e6; --paper-line:#dddddd; --paper-red:#c4161c;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b2026; --sunk:#161a1f; --ink:#e6e9ec; --muted:#98a2ad; --line:#2d343c;
  --steel:#0c0f12; --steel-ink:#e6e9ec; --red:#e5484d; --red-soft:#3a1d1f; --on-red:#ffffff;
  --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#352812; --bad:#f07b72; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b2026; --sunk:#161a1f; --ink:#e6e9ec; --muted:#98a2ad; --line:#2d343c;
  --steel:#0c0f12; --steel-ink:#e6e9ec; --red:#e5484d; --red-soft:#3a1d1f; --on-red:#ffffff;
  --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#352812; --bad:#f07b72; --bad-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--steel)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--steel);color:var(--steel-ink)}
.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.top img{width:38px;height:40px;object-fit:cover;border-radius:4px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;line-height:1.05;text-transform:uppercase}
.brand span{font-size:12px;opacity:.7}
.sync{margin-left:auto;font-size:12px;opacity:.75;white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7c8792;margin-right:6px;vertical-align:1px}
.sync.on i{background:#4cc27f}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--steel-ink);opacity:.7;font:600 13px var(--f-body);padding:10px 12px 11px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;letter-spacing:.02em}
nav.tabs button[aria-current="true"]{opacity:1;border-bottom-color:var(--red)}
nav.tabs button:hover{opacity:1}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;text-transform:uppercase}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16px;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--f-body);padding:8px 13px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.quick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.quick button b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.quick button span{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--sunk)}
table.list .r{text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.span2{grid-column:span 2}
@media (max-width:720px){.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:auto}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.line-top{display:flex;gap:8px;align-items:center}
.line-top .ln{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:22px;flex:none}
.line-grid{display:grid;grid-template-columns:1.1fr .8fr .8fr 1.1fr .9fr 1.2fr;gap:8px;align-items:end}
@media (max-width:640px){.line-grid{grid-template-columns:1fr 1fr 1fr}}
.amt{font-family:var(--f-mono);text-align:right;padding:8px 2px;font-variant-numeric:tabular-nums}
.totals{display:grid;grid-template-columns:auto auto;gap:6px 24px;justify-content:end;font-size:14px}
.totals .num{text-align:right}
.totals .grand{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:6px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:5}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);text-transform:uppercase;font-size:18px;margin-bottom:4px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:var(--steel-ink);padding:10px 16px;border-radius:var(--r);font-size:13.5px;z-index:50;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,15,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.search{max-width:280px}
.dochead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.paper-wrap{overflow-x:auto;padding-block:4px}
.paper{background:var(--paper);color:var(--paper-ink);width:794px;min-height:1000px;margin:0 auto;padding:28px 34px;font-family:Roboto,Arial,sans-serif;font-size:12.5px;line-height:1.4;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.paper .tag{display:flex;gap:10px;align-items:center;font-weight:600;font-size:13px}
.paper .tag em{font-style:normal;font-weight:400;font-size:11.5px;color:#888;border:1px solid #999;padding:1px 6px}
.paper .co{display:flex;gap:24px;margin:16px 0 14px 12px}
.paper .co img{width:132px;height:140px;object-fit:cover}
.paper .co h2{font-family:Roboto,Arial,sans-serif;text-transform:none;color:var(--paper-red);font-size:30px;letter-spacing:0;margin:10px 0 8px}
.paper .redbar{height:8px;background:var(--paper-red)}
.paper .band{background:var(--paper-band);display:flex;justify-content:space-between;padding:14px 18px;font-size:13px}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:14px 0 18px}
.paper .parties h4{font-weight:500;margin:0 0 6px;font-size:13px}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:right;font-weight:500;padding:12px 10px;border-top:2px solid var(--paper-red);border-bottom:2px solid var(--paper-red);font-size:13px}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.paper td .d{font-size:11px;color:#333;white-space:pre-line}
.paper tr.sub td{border-top:2px solid var(--paper-red);border-bottom:2px solid var(--paper-red);font-weight:600}
.paper .foot{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px}
.paper .kv{display:grid;grid-template-columns:120px 1fr;gap:3px 6px}
.paper .tot{display:grid;grid-template-columns:1fr auto;gap:4px 24px;text-align:right}
.paper .tot .g{font-weight:700;border-top:1px solid #333;border-bottom:1px solid #333;padding:5px 0}
.paper .terms{white-space:pre-line;font-size:12px}
.paper .sign{text-align:right;margin-top:48px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
table.list.gst td{white-space:nowrap}
table.list.gst tr.ft td{font-weight:600;border-top:2px solid var(--line)}
.payments{display:flex;flex-direction:column;gap:6px}
@media print{
  body{background:#fff} header.top,.noprint,.toast{display:none!important}
  main{padding:0} .paper{box-shadow:none;width:auto;min-height:0;padding:0} .paper-wrap{overflow:visible}
  @page{size:A4;margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g,"")); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => { n = r2(num(n)); return n.toLocaleString("en-IN", {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2}); };
const money = n => "₹ " + fmt(n);
const pad2 = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + num(n)); return iso(d); };
const dmy = s => s ? s.split("-").reverse().join("/") : "";
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const stateOfGstin = g => { const c = String(g||"").slice(0,2); return STATES[c] ? {code:c, name:STATES[c]} : null; };

function words(n){
  n = Math.floor(Math.abs(n));
  if (n === 0) return "Zero";
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? " " + a[x%10] : "");
  const three = x => x >= 100 ? a[Math.floor(x/100)] + " Hundred" + (x%100 ? " " + two(x%100) : "") : two(x);
  const out = [];
  const cr = Math.floor(n/1e7); n %= 1e7;
  const l = Math.floor(n/1e5); n %= 1e5;
  const t = Math.floor(n/1e3); n %= 1e3;
  if (cr) out.push((cr >= 1000 ? words(cr) : three(cr)) + " Crore");
  if (l) out.push(two(l) + " Lakh");
  if (t) out.push(two(t) + " Thousand");
  if (n) out.push(three(n));
  return out.join(" ");
}
function amountWords(total){
  const r = Math.floor(total), p = Math.round((total - r) * 100);
  return words(r) + " Rupees" + (p ? " and " + words(p) + " Paise" : "");
}

function calc(d){
  let taxable = 0, tax = 0, qty = 0; const byRate = {};
  const lines = (d.lines || []).map(l => {
    const amt = r2(num(l.qty) * num(l.rate));
    const t = r2(amt * num(l.gst) / 100);
    taxable += amt; tax += t; qty += num(l.qty);
    const k = String(num(l.gst)); byRate[k] = r2((byRate[k] || 0) + t);
    return {...l, taxable: amt, tax: t, total: r2(amt + t)};
  });
  taxable = r2(taxable); tax = r2(tax);
  const gross = d.rcm ? taxable : r2(taxable + tax);
  const total = d.noRound ? gross : Math.round(gross);
  const roundOff = r2(total - gross);
  const received = r2((d.payments || []).reduce((s, p) => s + num(p.amount), 0));
  return {lines, taxable, tax, qty, byRate, gross, total, roundOff, received, balance: r2(total - received)};
}
function status(d){
  const c = calc(d);
  if (d.cancelled) return ["Cancelled","neu"];
  if (d.type === "QTN") return d.convertedTo ? ["Converted","ok"] : (d.due && d.due < today() ? ["Expired","neu"] : ["Open","warn"]);
  if (c.balance <= 0) return ["Paid","ok"];
  if (d.due && d.due < today()) return [c.received > 0 ? "Part paid · overdue" : "Overdue","bad"];
  return [c.received > 0 ? "Part paid" : (d.type === "PUR" ? "Unpaid" : "Due"),"warn"];
}
function nextNo(type){
  const pre = type === "INV" ? S.co.invPrefix : type === "QTN" ? S.co.qtnPrefix : "";
  let max = 0;
  Object.values(S.docs).forEach(d => {
    if (d.type !== type || !String(d.no).startsWith(pre)) return;
    const n = parseInt(String(d.no).slice(pre.length), 10);
    if (isFinite(n) && n > max) max = n;
  });
  return pre + (max + 1);
}
function docsOf(type){ return Object.values(S.docs).filter(d => d.type === type).sort((a,b) => (b.date||"").localeCompare(a.date||"") || String(b.no).localeCompare(String(a.no), undefined, {numeric:true})); }
function fileSafe(s){ return String(s).replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim(); }

/* ---------- storage ---------- */
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); S.co = {...DEFAULT_CO, ...(o.co||{})}; S.parties = o.parties||{}; S.items = o.items||{}; S.docs = o.docs||{}; } } catch(e) {}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({co:S.co, parties:S.parties, items:S.items, docs:S.docs})); } catch(e) { toast("Could not save on this device. Storage may be full or blocked."); } }
async function put(col, id, data){
  if (col === "config") S.co = {...DEFAULT_CO, ...data}; else S[col][id] = data;
  if (MODE === "db") {
    try { await DB.collection(col).doc(id).set(data); }
    catch(e) { handleWriteError(e); throw e; }
  } else if (MODE === "server") {
    try { await api("put", {col, id, data}); } catch(e) { serverErr(e); throw e; }
  } else if (MODE === "idb") {
    try { await idbWrite([[col, col === "config" ? "company" : id, data]]); } catch(e) { toast("Could not save to the database on this device."); throw e; }
  } else saveLocal();
}
async function del(col, id){
  delete S[col][id];
  if (MODE === "db") { try { await DB.collection(col).doc(id).delete(); } catch(e){ handleWriteError(e); throw e; } }
  else if (MODE === "server") { try { await api("del", {col, id}); } catch(e) { serverErr(e); throw e; } }
  else if (MODE === "idb") { try { await idbWrite([[col, id, null]]); } catch(e) { toast("Could not delete from the database."); throw e; } }
  else saveLocal();
}
function handleWriteError(e){
  const c = e && e.code;
  if (c === "invalid_argument") { CANWRITE = false; toast("You have view-only access. Ask the owner for Contributor access to make changes."); }
  else if (c === "quota_exceeded") toast("Storage is full. Export a backup and delete old documents.");
  else toast("Could not save. Check your connection and try again.");
}

function setSync(text, on){ const s = $("#sync"); s.className = "sync" + (on ? " on" : ""); s.lastElementChild.textContent = text; }
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button data-tab="${k}" aria-current="${UI.tab===k}">${l}</button>`).join("");
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (!b) return; go(b.dataset.tab); });
function go(tab, view=null){ UI.tab = tab; UI.view = view; UI.q = ""; render(); window.scrollTo(0,0); }
function isEditing(){ return UI.view && (UI.view.kind === "edit" || UI.view.kind === "form" || UI.view.kind === "pay"); }
function softRender(){ if (!isEditing()) render(); else { renderTabs(); fillDatalist(); } }
function render(){
  renderTabs(); fillDatalist();
  $("#hdrName").textContent = S.co.name || "Billing";
  const m = $("#main");
  const v = UI.view;
  if (v && v.kind === "doc") return renderDoc(m, v.id);
  if (v && v.kind === "edit") return renderEditor(m);
  if (v && v.kind === "form") return renderForm(m);
  if (v && v.kind === "pay") return renderPay(m);
  ({dash:renderDash, inv:()=>renderList(m,"INV"), qtn:()=>renderList(m,"QTN"), pur:()=>renderList(m,"PUR"), gst:renderGST, parties:renderParties, items:renderItems, settings:renderSettings})[UI.tab](m);
}
function fillDatalist(){ $("#itemlist").innerHTML = Object.values(S.items).map(i => `<option value="${esc(i.name)}"></option>`).join(""); }
function loading(){ return MODE === "db" && !(READY.parties && READY.items && READY.docs); }
function roBanner(){ return CANWRITE ? "" : `<div class="banner">You can view these bills but not change them. The owner can give you Contributor access from the Share menu.</div>`; }

/* ---------- dashboard ---------- */
function renderDash(m){
  const now = new Date(); const fy = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
  const fyS = `${fy}-04-01`, fyE = `${fy+1}-03-31`, mS = iso(new Date(now.getFullYear(), now.getMonth(), 1));
  const inFY = d => d.date >= fyS && d.date <= fyE;
  let sales=0, salesM=0, outGst=0, purch=0, inGst=0, recv=0, recvN=0, pay=0;
  Object.values(S.docs).forEach(d => {
    if (d.cancelled) return;
    const c = calc(d);
    if (d.type === "INV") { if (inFY(d)) { sales += c.total; outGst += c.tax; } if (d.date >= mS) salesM += c.total; if (c.balance > 0) { recv += c.balance; recvN++; } }
    if (d.type === "PUR") { if (inFY(d)) { purch += c.total; inGst += c.tax; } if (c.balance > 0) pay += c.balance; }
  });
  const openQ = docsOf("QTN").filter(d => !d.convertedTo).length;
  const recent = Object.values(S.docs).sort((a,b) => (b.updated||0) - (a.updated||0)).slice(0,8);
  m.innerHTML = `<div class="stack">
    ${roBanner()}
    ${backupDue() ? `<div class="banner row spread"><span>${lastBackup() ? "Your last backup was on " + dmy(lastBackup()) + "." : "You have not downloaded a backup yet."} Your bills live only in this browser, so keep a copy safe.</span><button class="btn" id="bk">Download backup</button></div>` : ""}
    <div class="row spread"><h1>Dashboard</h1><span class="muted small">FY ${fy}-${String(fy+1).slice(2)} · ${dmy(today())}</span></div>
    ${CANWRITE ? `<div class="quick">
      <button data-new="INV"><b>New invoice</b><span>${esc(nextNo("INV"))}</span></button>
      <button data-new="QTN"><b>New quotation</b><span>${esc(nextNo("QTN"))}</span></button>
      <button data-new="PUR"><b>New purchase bill</b><span>Record a supplier bill</span></button>
    </div>` : ""}
    <div class="kpis">
      <div class="kpi"><label>Sales this FY</label><div class="v">${money(sales)}</div><div class="s">This month ${money(salesM)}</div></div>
      <div class="kpi"><label>To receive</label><div class="v">${money(recv)}</div><div class="s">${recvN} unpaid invoice${recvN===1?"":"s"}</div></div>
      <div class="kpi"><label>Purchases this FY</label><div class="v">${money(purch)}</div><div class="s">To pay ${money(pay)}</div></div>
      ${(()=>{ const P = periods().month[1] || periods().month[0]; const g = gstr3b(P); return `<div class="kpi"><label>GST cash to pay · ${P.label}</label><div class="v">${money(r2(g.cash.i+g.cash.c+g.cash.s))}</div><div class="s">Output ${money(r2(g.out.i+g.out.c+g.out.s))} · ITC ${money(r2(g.itc.i+g.itc.c+g.itc.s))}</div></div>`; })()}
      <div class="kpi"><label>Open quotations</label><div class="v">${openQ}</div><div class="s">Not yet converted</div></div>
    </div>
    <div class="panel"><div class="pad row spread"><h3>Recent documents</h3></div>
      ${loading() ? `<div class="empty">Loading your bills…</div>` : recent.length ? docTable(recent, true) : `<div class="empty"><b>No bills yet</b>Create your first invoice or quotation with the buttons above.</div>`}
    </div></div>`;
  bindDocTable(m);
  m.querySelectorAll("[data-new]").forEach(b => b.onclick = () => newDoc(b.dataset.new));
  const bk = $("#bk", m); if (bk) bk.onclick = () => downloadBackup().then(render);
}
function docTable(list, showType){
  return `<div class="tablewrap"><table class="list"><thead><tr>${showType?"<th>Type</th>":""}<th>No.</th><th>Date</th><th>Party</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
  ${list.map(d => { const c = calc(d), [st, cls] = status(d);
    return `<tr class="click" data-open="${esc(d.id)}">${showType?`<td>${TYPES[d.type].short}</td>`:""}<td class="num">${esc(d.no)}</td><td class="num">${dmy(d.date)}</td><td>${esc(d.party?.name)}</td><td class="r num">${fmt(c.total)}${d.type!=="QTN" && c.received>0 && c.balance>0?`<div class="muted small">Bal ${fmt(c.balance)}</div>`:""}</td><td><span class="pill ${cls}">${st}</span></td></tr>`; }).join("")}
  </tbody></table></div>`;
}
function bindDocTable(m){ m.querySelectorAll("[data-open]").forEach(tr => tr.onclick = () => { UI.view = {kind:"doc", id:tr.dataset.open}; render(); window.scrollTo(0,0); }); }

/* ---------- lists ---------- */
function renderList(m, type){
  const T = TYPES[type]; const q = UI.q.toLowerCase();
  const all = docsOf(type);
  const list = all.filter(d => !q || [d.no, d.party?.name, ...(d.lines||[]).map(l=>l.name)].join(" ").toLowerCase().includes(q));
  let tot = 0, bal = 0; list.forEach(d => { if (d.cancelled) return; const c = calc(d); tot += c.total; bal += c.balance; });
  m.innerHTML = `<div class="stack">${roBanner()}
    <div class="row spread"><h1>${T.plural}</h1>${CANWRITE?`<button class="btn pri" id="newBtn">+ New ${T.short.toLowerCase()}</button>`:""}</div>
    <div class="row spread"><input class="search" id="q" type="search" placeholder="Search number, party or item" value="${esc(UI.q)}">
      <span class="muted small">${list.length} shown · Total <span class="num">${money(tot)}</span>${type!=="QTN"?` · Balance <span class="num">${money(bal)}</span>`:""}</span></div>
    <div class="panel">${loading() ? `<div class="empty">Loading…</div>` : list.length ? docTable(list, false) : `<div class="empty"><b>No ${T.plural.toLowerCase()} ${q?"match":"yet"}</b>${q?"Try another search.":`Tap “New ${T.short.toLowerCase()}” to create one.`}</div>`}</div></div>`;
  bindDocTable(m);
  const nb = $("#newBtn", m); if (nb) nb.onclick = () => newDoc(type);
  const qi = $("#q", m); qi.oninput = () => { UI.q = qi.value; const pos = qi.selectionStart; renderList(m, type); const n = $("#q", m); n.focus(); n.setSelectionRange(pos,pos); };
}

/* ---------- document view ---------- */
function paperHTML(d){
  const T = TYPES[d.type], c = calc(d), co = S.co;
  const igst = !!d.igst;
  const showHsn = c.lines.some(l => l.hsn);
  const title = d.type === "INV" ? "TAX INVOICE" : d.type === "QTN" ? "QUOTATION" : "PURCHASE BILL";
  const taxRows = Object.entries(c.byRate).filter(([r,t]) => num(r) > 0).flatMap(([r,t]) => igst ? [[`IGST @${fmt(r)}%`, t]] : [[`CGST @${fmt(num(r)/2)}%`, r2(t/2)], [`SGST @${fmt(num(r)/2)}%`, r2(t - r2(t/2))]]);
  const p = d.party || {};
  const isPur = d.type === "PUR";
  const head = isPur
    ? `<div class="co"><div><h2>${esc(p.name)}</h2><div>${esc(p.address)}</div>${p.gstin?`<div><b>GSTIN:</b> ${esc(p.gstin)}</div>`:""}${p.phone?`<div><b>Mobile:</b> ${esc(p.phone)}</div>`:""}</div></div>`
    : `<div class="co"><img src="${LOGO}" alt=""><div><h2>${esc(co.name)}</h2><div>${esc(co.address)}</div>
        <div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:6px"><span><b>Mobile:</b> ${esc(co.mobile)}</span><span><b>GSTIN:</b> ${esc(co.gstin)}</span><span><b>PAN Number:</b> ${esc(co.pan)}</span></div>
        <div><b>Email:</b> ${esc(co.email)}</div></div></div>`;
  const partyBlock = (label, x) => `<div><h4>${label}</h4><div style="font-weight:700;font-size:14px;margin-bottom:4px">${esc(x.name)}</div><div style="white-space:pre-line">${esc(x.address)}</div>
    ${x.gstin?`<div>GSTIN: &nbsp; ${esc(x.gstin)}</div>`:""}${x.pan?`<div>PAN Number: &nbsp;${esc(x.pan)}</div>`:""}${x.pos?`<div>Place of Supply: &nbsp;${esc(x.pos)}</div>`:""}</div>`;
  const ship = d.shipSame !== false ? {name:p.name, address:p.address} : {name:d.shipName, address:d.shipAddress};
  return `<div class="paper">
    <div class="tag">${title}${d.cancelled?` <em style="color:#c4161c;border-color:#c4161c">CANCELLED</em>`:""} <em>${d.type==="INV"?"ORIGINAL FOR RECIPIENT":isPur?"PURCHASE RECORD":"ESTIMATE"}</em></div>
    ${head}
    <div class="redbar"></div>
    <div class="band"><span><b>${T.noLabel}:</b> ${esc(d.no)}</span><span><b>${T.dateLabel.replace("Quotation ","")}:</b> ${dmy(d.date)}</span><span>${d.due?`<b>${T.due}:</b> ${dmy(d.due)}`:""}</span></div>
    <div class="parties">${isPur ? partyBlock("BILLED TO (US)", {name:co.name, address:co.address, gstin:co.gstin, pan:co.pan}) + `<div>${d.ref?`<h4>OUR ENTRY REF.</h4><div>${esc(d.ref)}</div>`:""}</div>`
      : partyBlock(T.partyLabel.toUpperCase(), {...p, pos:d.pos}) + (d.type==="INV" || d.shipSame===false ? partyBlock("SHIP TO", ship) : "<div></div>")}</div>
    <table><thead><tr><th>ITEMS</th>${showHsn?"<th>HSN/SAC</th>":""}<th>QTY.</th><th>RATE</th><th>TAX</th><th>AMOUNT</th></tr></thead><tbody>
      ${c.lines.map(l => `<tr><td><div style="font-size:13px">${esc(l.name)}</div>${l.desc?`<div class="d">${esc(l.desc)}</div>`:""}</td>${showHsn?`<td>${esc(l.hsn)}</td>`:""}
        <td>${fmt(l.qty)} ${esc(l.unit||"")}</td><td>${fmt(l.rate)}</td><td>${fmt(l.tax)}<div class="d" style="color:#777">(${fmt(l.gst)}%)</div></td><td>${fmt(l.total)}</td></tr>`).join("")}
      <tr class="sub"><td>SUBTOTAL</td>${showHsn?"<td></td>":""}<td>${fmt(c.qty)}</td><td></td><td>₹ ${fmt(c.tax)}</td><td>₹ ${fmt(c.gross)}</td></tr>
    </tbody></table>
    <div class="foot">
      <div>${isPur ? "" : `<div style="font-weight:700;margin-bottom:4px">BANK DETAILS</div><div class="kv"><span>Name:</span><span>${esc(co.bankName)}</span><span>IFSC Code:</span><span>${esc(co.ifsc)}</span><span>Account No:</span><span>${esc(co.account)}</span><span>Bank:</span><span>${esc(co.bank)}</span></div>`}</div>
      <div class="tot"><span>Taxable Amount</span><span>₹ ${fmt(c.taxable)}</span>
        ${taxRows.map(([l,v]) => `<span>${l}</span><span>₹ ${fmt(v)}</span>`).join("")}
        ${c.roundOff?`<span>Round Off</span><span>${c.roundOff>0?"+":"−"} ₹ ${fmt(Math.abs(c.roundOff))}</span>`:""}
        <span class="g">${d.rcm?"Total (GST under RCM paid by us)":"Total Amount"}</span><span class="g">₹ ${fmt(c.total)}</span>
        ${d.type!=="QTN"?`<span>${isPur?"Paid":"Received"} Amount</span><span>₹ ${fmt(c.received)}</span>${c.received>0?`<span>Balance</span><span>₹ ${fmt(c.balance)}</span>`:""}`:""}
      </div>
    </div>
    <div class="foot">
      <div>${isPur ? (d.notes?`<div style="font-weight:700">NOTES</div><div class="terms">${esc(d.notes)}</div>`:"") : `<div style="font-weight:700;margin-bottom:4px">TERMS AND CONDITIONS</div><div class="terms">${esc(d.terms)}</div>${d.notes?`<div style="font-weight:700;margin:8px 0 2px">NOTES</div><div class="terms">${esc(d.notes)}</div>`:""}`}</div>
      <div style="text-align:right"><div style="font-weight:700">Total Amount (in words)</div><div>${amountWords(c.total)}</div>
        ${isPur?"":`<div class="sign">For ${esc(co.name)}<br><br><br>Authorised Signatory</div>`}</div>
    </div></div>`;
}
function renderDoc(m, id){
  const d = S.docs[id];
  if (!d) { m.innerHTML = `<div class="empty"><b>Document not found</b>It may have been deleted.<br><br><button class="btn" id="back">Back</button></div>`; $("#back").onclick = () => go(UI.tab); return; }
  const T = TYPES[d.type], c = calc(d), [st, cls] = status(d);
  const standalone = !window.claude;
  m.innerHTML = `<div class="stack">
    <div class="dochead noprint"><div class="stack" style="gap:4px"><button class="btn ghost" id="back" style="padding-left:0">← ${T.plural}</button>
      <h1>${T.short} ${esc(d.no)}</h1><div class="row"><span class="pill ${cls}">${st}</span><span class="muted small">${esc(d.party?.name)} · <span class="num">${money(c.total)}</span>${d.convertedTo?` · Invoice ${esc(S.docs[d.convertedTo]?.no||"")}`:""}${d.fromQtn&&S.docs[d.fromQtn]?` · From quotation ${esc(S.docs[d.fromQtn].no)}`:""}</span></div></div>
      <div class="row">
        <button class="btn pri" id="pdf">Download PDF</button>
        ${standalone?`<button class="btn" id="print">Print</button>`:""}
        ${CANWRITE?`<button class="btn" id="edit">Edit</button>`:""}
        ${CANWRITE && d.type==="INV"?`<button class="btn" id="cancelInv">${d.cancelled?"Restore invoice":"Cancel invoice"}</button>`:""}
        ${CANWRITE && !d.cancelled && d.type!=="QTN" && c.balance>0?`<button class="btn" id="pay">${d.type==="PUR"?"Record payment made":"Record payment received"}</button>`:""}
        ${CANWRITE && d.type==="QTN" && !d.convertedTo?`<button class="btn" id="conv">Convert to invoice</button>`:""}
        ${CANWRITE?`<button class="btn" id="dup">Duplicate</button><button class="btn danger" id="delete">Delete</button>`:""}
      </div></div>
    ${!standalone?`<div class="muted small noprint">To print, download the PDF and print it from your phone or computer.</div>`:""}
    ${(d.payments||[]).length?`<div class="panel pad noprint"><h3>Payments</h3><div class="payments" style="margin-top:8px">${d.payments.map((p,i)=>`<div class="row spread"><span>${dmy(p.date)} · ${esc(p.mode||"")}${p.ref?" · "+esc(p.ref):""}</span><span class="row"><span class="num">${money(p.amount)}</span>${CANWRITE?`<button class="btn ghost small" data-rmpay="${i}">Remove</button>`:""}</span></div>`).join("")}</div></div>`:""}
    <div class="paper-wrap">${paperHTML(d)}</div></div>`;
  $("#back").onclick = () => go(T.tab);
  $("#pdf").onclick = () => downloadPDF(d);
  const pr = $("#print"); if (pr) pr.onclick = () => window.print();
  const ed = $("#edit"); if (ed) ed.onclick = () => { UI.view = {kind:"edit", draft: JSON.parse(JSON.stringify(d))}; render(); window.scrollTo(0,0); };
  const pb = $("#pay"); if (pb) pb.onclick = () => { UI.view = {kind:"pay", id, draft:{date:today(), amount:c.balance, mode:"Bank transfer", ref:""}}; render(); };
  const ci = $("#cancelInv"); if (ci) ci.onclick = () => confirmBox(d.cancelled ? `Restore invoice ${d.no}? It will count in sales and GST reports again.` : `Cancel invoice ${d.no}? It stays in the list and in GSTR-1 Table 13 as cancelled, but is removed from sales and tax totals.`, d.cancelled ? "Restore" : "Cancel invoice").then(ok => { if (!ok) return; const x = JSON.parse(JSON.stringify(d)); x.cancelled = !d.cancelled; x.updated = Date.now(); put("docs", id, x).then(() => { toast(x.cancelled ? "Invoice cancelled" : "Invoice restored"); render(); }).catch(()=>{}); });
  const cv = $("#conv"); if (cv) cv.onclick = () => convertQtn(d);
  const du = $("#dup"); if (du) du.onclick = () => { const x = JSON.parse(JSON.stringify(d)); x.id = uid("d"); x.no = d.type==="PUR" ? "" : nextNo(d.type); x.date = today(); x.due = defaultDue(d.type, x.date); x.payments = []; delete x.convertedTo; delete x.fromQtn; UI.view = {kind:"edit", draft:x, isNew:true}; render(); };
  const dl = $("#delete"); if (dl) dl.onclick = () => confirmBox(`Delete ${T.short.toLowerCase()} ${d.no}? This cannot be undone.`, "Delete").then(ok => { if (!ok) return; del("docs", id).then(() => { toast(`${T.short} deleted`); go(T.tab); }).catch(()=>{}); });
  m.querySelectorAll("[data-rmpay]").forEach(b => b.onclick = () => confirmBox("Remove this payment entry?","Remove").then(ok => { if (!ok) return; const x = JSON.parse(JSON.stringify(d)); x.payments.splice(+b.dataset.rmpay,1); x.updated = Date.now(); put("docs", id, x).then(() => render()).catch(()=>{}); }));
}
function defaultDue(type, date){ return type === "INV" ? addDays(date, S.co.dueDays) : type === "QTN" ? addDays(date, S.co.qtnValidDays) : ""; }
function convertQtn(q){
  const x = JSON.parse(JSON.stringify(q));
  Object.assign(x, {id: uid("d"), type:"INV", no: nextNo("INV"), date: today(), due: defaultDue("INV", today()), terms: S.co.terms, payments: [], fromQtn: q.id, shipSame: q.shipSame !== false});
  delete x.convertedTo;
  UI.view = {kind:"edit", draft:x, isNew:true}; render(); window.scrollTo(0,0);
}

/* ---------- payment form ---------- */
function renderPay(m){
  const v = UI.view, d = S.docs[v.id]; const c = calc(d);
  m.innerHTML = `<div class="stack" style="max-width:520px"><button class="btn ghost" id="back" style="padding-left:0;align-self:flex-start">← Back</button>
    <h1>${d.type==="PUR"?"Payment made":"Payment received"}</h1><div class="muted">${TYPES[d.type].short} ${esc(d.no)} · ${esc(d.party?.name)} · Balance <span class="num">${money(c.balance)}</span></div>
    <div class="panel pad stack"><div class="grid2">
      <label class="f"><span>Date</span><input type="date" id="pd" value="${v.draft.date}"></label>
      <label class="f"><span>Amount (₹)</span><input id="pa" inputmode="decimal" value="${v.draft.amount}"></label>
      <label class="f"><span>Mode</span><select id="pm">${["Bank transfer","UPI","Cheque","Cash","NEFT/RTGS"].map(o=>`<option ${o===v.draft.mode?"selected":""}>${o}</option>`).join("")}</select></label>
      <label class="f"><span>Reference</span><input id="pr" placeholder="UTR / cheque no." value="${esc(v.draft.ref)}"></label></div>
      <div class="row"><button class="btn pri" id="save">Save payment</button></div></div></div>`;
  $("#back").onclick = () => { UI.view = {kind:"doc", id:v.id}; render(); };
  $("#save").onclick = () => {
    const amt = r2(num($("#pa").value)); if (amt <= 0) return toast("Enter the amount.");
    const x = JSON.parse(JSON.stringify(d)); x.payments = [...(x.payments||[]), {date:$("#pd").value||today(), amount:amt, mode:$("#pm").value, ref:$("#pr").value.trim()}]; x.updated = Date.now();
    put("docs", x.id, x).then(() => { toast("Payment saved"); UI.view = {kind:"doc", id:x.id}; render(); }).catch(()=>{});
  };
}

/* ---------- editor ---------- */
function blankLine(){ return {name:"", desc:"", hsn:"", qty:1, unit:"PCS", rate:"", gst:18, saveItem:true}; }
function newDoc(type){
  const d = today();
  UI.view = {kind:"edit", isNew:true, draft:{id:uid("d"), type, no: type==="PUR" ? "" : nextNo(type), date:d, due:defaultDue(type,d),
    party:null, pos:S.co.state, igst:false, shipSame:true, shipName:"", shipAddress:"", lines:[blankLine()], terms: type==="INV" ? S.co.terms : type==="QTN" ? S.co.qtnTerms : "", notes:"", payments:[], ref:""}};
  UI.tab = TYPES[type].tab; render(); window.scrollTo(0,0);
}
function partyOptions(role){ return Object.values(S.parties).filter(p => p.role === role || p.role === "both").sort((a,b) => a.name.localeCompare(b.name)); }
function renderEditor(m){
  const v = UI.view, d = v.draft, T = TYPES[d.type];
  const plist = partyOptions(T.partyRole);
  const curId = d.party?.id && S.parties[d.party.id] ? d.party.id : (d.party ? "__new" : "");
  if (curId === "__new" && !v.np) v.np = {...d.party};
  m.innerHTML = `<div class="stack">
    <button class="btn ghost" id="back" style="padding-left:0;align-self:flex-start">← Cancel</button>
    <h1>${v.isNew ? "New" : "Edit"} ${T.short.toLowerCase()}</h1>
    <div class="panel pad stack"><div class="grid4">
      <label class="f"><span>${T.noLabel}</span><input id="no" value="${esc(d.no)}" ${d.type==="PUR"?'placeholder="As on supplier bill"':""}></label>
      <label class="f"><span>${T.dateLabel}</span><input type="date" id="date" value="${d.date}"></label>
      <label class="f"><span>${T.due}</span><input type="date" id="due" value="${d.due||""}"></label>
      ${d.type==="PUR" ? `<label class="f"><span>Our ref. (optional)</span><input id="ref" value="${esc(d.ref||"")}"></label>`
        : `<label class="f"><span>Place of supply</span><input id="pos" value="${esc(d.pos||"")}"></label>`}
    </div></div>
    <div class="panel pad stack"><h3>${T.partyLabel}</h3>

      <div id="pbox"></div>

async function saveDoc(){
  const v = UI.view, d = v.draft, T = TYPES[d.type];
  d.no = String(d.no||"").trim();
  if (!d.no) return toast(`Enter the ${T.noLabel.toLowerCase().replace(".","")}.`);
  if (!d.party || !String(d.party.name||"").trim()) return toast(`Choose or add the ${T.partyRole}.`);
  const lines = d.lines.filter(l => String(l.name).trim());
  if (!lines.length) return toast("Add at least one item.");
  if (lines.some(l => num(l.qty) <= 0)) return toast("Each item needs a quantity above zero.");
  const dup = Object.values(S.docs).find(x => x.type === d.type && x.id !== d.id && x.no === d.no && (d.type !== "PUR" || x.party?.name === d.party.name));
  if (dup && !(await confirmBox(`${T.noLabel} ${d.no} is already used. Save anyway?`, "Save anyway"))) return;
  $("#save").disabled = true;
  try {
    if (v.np && v.np.name.trim()) {
      const pid = uid("p"); const st = stateOfGstin(v.np.gstin);
      const party = {id:pid, role:T.partyRole, name:v.np.name.trim(), address:v.np.address.trim(), gstin:v.np.gstin, pan:v.np.pan, phone:v.np.phone, email:"", state: st ? st.name : (d.type!=="PUR" ? d.pos : ""), updated:Date.now()};
      await put("parties", pid, party); d.party = {id:pid, name:party.name, address:party.address, gstin:party.gstin, pan:party.pan, phone:party.phone};
    }
    for (const l of lines) {
      const exists = Object.values(S.items).some(x => x.name.toLowerCase() === l.name.trim().toLowerCase());
      if (!exists && l.saveItem !== false && d.type !== "PUR") { const iid = uid("i"); await put("items", iid, {id:iid, name:l.name.trim(), desc:l.desc||"", hsn:l.hsn||"", unit:l.unit||"PCS", rate:num(l.rate), gst:num(l.gst), updated:Date.now()}); }
    }
    const out = {...d, lines: lines.map(l => ({name:l.name.trim(), desc:String(l.desc||"").trim(), hsn:String(l.hsn||"").trim(), qty:num(l.qty), unit:String(l.unit||"").trim(), rate:num(l.rate), gst:num(l.gst)})), updated: Date.now()};
    if (v.isNew && num(v.paidNow) > 0) out.payments = [...(out.payments||[]), {date: out.date, amount: r2(num(v.paidNow)), mode:"", ref:""}];
    if (!out.created) out.created = Date.now();
    await put("docs", out.id, out);
    if (out.fromQtn && S.docs[out.fromQtn] && !S.docs[out.fromQtn].convertedTo) { const q = {...S.docs[out.fromQtn], convertedTo: out.id, updated: Date.now()}; await put("docs", q.id, q); }
    toast(`${T.short} ${out.no} saved`);
    UI.view = {kind:"doc", id:out.id}; render(); window.scrollTo(0,0);
  } catch(e) { const b = $("#save"); if (b) b.disabled = false; }
}

          ["SGST", f(r2(g.out.s + g.rcm.s)), f(so.u.i.s), "—", f(so.u.s.s), f(so.cash.s), f(g.rcm.s), f(g.cash.s)]],
          ["Total", f(r2(g.out.i+g.out.c+g.out.s+g.rcm.i+g.rcm.c+g.rcm.s)), "", "", "", f(r2(so.cash.i+so.cash.c+so.cash.s)), f(r2(g.rcm.i+g.rcm.c+g.rcm.s)), f(r2(g.cash.i+g.cash.c+g.cash.s))])

           <div class="kpi"><label>ITC carried forward</label><div class="v">${money(r2(so.balance.i+so.balance.c+so.balance.s))}</div><div class="s">IGST ${f(so.balance.i)} · CGST ${f(so.balance.c)} · SGST ${f(so.balance.s)}</div></div></div>`);
  } else {
    const rows = g.reg.sort((a,b) => a.d.date.localeCompare(b.d.date)).map(x => [dmy(x.d.date), esc(x.d.no), esc(x.d.party?.name), esc(x.d.party?.gstin||"—"), ...tr(x), x.d.rcm ? "Yes" : "No", x.d.rcm ? "RCM" : x.ok ? "Eligible" : "No GSTIN"]);
    const tot = g.reg.reduce((a,x) => addT(a, x), zero());
    body = sec("pr","Purchase register (ITC)", "Every supplier bill in the period. Tick it against GSTR-2B on the portal.",
      tbl(["Bill date","Bill no.","Supplier","GSTIN","Taxable","IGST","CGST","SGST","Reverse charge","ITC"], rows, ["Total","","","",...tr(tot),"",""], "pur"));
  }
  const warn = v === "r1" ? r1.warn : v === "r3b" ? [...r1.warn.filter(w => !/HSN/.test(w)), ...g.warn] : g.warn;
  m.innerHTML = `<div class="stack">
    <div class="row spread"><h1>GST reports</h1><span class="muted small">${esc(S.co.gstin)} · ${esc(P.label)} · ${dmy(P.from)} to ${dmy(P.to)}</span></div>
    <div class="row">
      <div class="seg" role="tablist">${[["r1","GSTR-1"],["r3b","GSTR-3B"],["pr","Purchase register"]].map(([k,l]) => `<button data-sub="${k}" aria-pressed="${v===k}">${l}</button>`).join("")}</div>
      <select id="ptype" style="width:auto">${[["month","Monthly"],["quarter","Quarterly"],["fy","Financial year"]].map(([k,l]) => `<option value="${k}" ${GST_PERIOD.type===k?"selected":""}>${l}</option>`).join("")}</select>
      <select id="pkey" style="width:auto">${all[GST_PERIOD.type].map(p => `<option value="${p.key}" ${p.key===P.key?"selected":""}>${p.label}</option>`).join("")}</select>
    </div>
    ${warn.length ? `<div class="banner"><b>Check before filing (${warn.length})</b><ul style="margin:6px 0 0;padding-left:18px">${warn.slice(0,12).map(w => `<li>${esc(w)}</li>`).join("")}${warn.length>12?`<li>…and ${warn.length-12} more</li>`:""}</ul></div>` : ""}
    ${loading() ? `<div class="empty">Loading…</div>` : body}
    <div class="muted small">Figures come from the bills saved here. Cancelled invoices and quotations are excluded. Credit and debit notes, amendments, interest and late fee are not included.</div>
  </div>`;
  m.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { GST_PERIOD.sub = b.dataset.sub; renderGST(m); });
  $("#ptype", m).onchange = e => { GST_PERIOD.type = e.target.value; GST_PERIOD.key = null; renderGST(m); };
  $("#pkey", m).onchange = e => { GST_PERIOD.key = e.target.value; renderGST(m); };
  const tag = P.label.replace(/[^\w-]+/g, "-");
  const csv = {
    b2b: () => csvSave(`GSTR1 B2B ${tag}.csv`, ["GSTIN/UIN of Recipient","Receiver Name","Invoice Number","Invoice date","Invoice Value","Place Of Supply","Reverse Charge","Invoice Type","Rate","Taxable Value","Integrated Tax","Central Tax","State/UT Tax","Cess Amount"], r1.b2b.map(x => [x.gstin, x.name, x.no, dmy(x.date), x.value, x.pos, "N", "Regular B2B", x.rate, x.taxable, x.i, x.c, x.s, 0])),
    b2cl: () => csvSave(`GSTR1 B2CL ${tag}.csv`, ["Invoice Number","Invoice date","Invoice Value","Place Of Supply","Rate","Taxable Value","Integrated Tax","Cess Amount"], r1.b2cl.map(x => [x.no, dmy(x.date), x.value, x.pos, x.rate, x.taxable, x.i, 0])),
    b2cs: () => csvSave(`GSTR1 B2CS ${tag}.csv`, ["Type","Place Of Supply","Rate","Taxable Value","Integrated Tax","Central Tax","State/UT Tax","Cess Amount"], Object.values(r1.b2cs).map(x => ["OE", x.pos, x.rate, x.taxable, x.i, x.c, x.s, 0])),
    hsnB2B: () => csvSave(`GSTR1 HSN B2B ${tag}.csv`, ["HSN","Description","UQC","Total Quantity","Total Value","Rate","Taxable Value","Integrated Tax Amount","Central Tax Amount","State/UT Tax Amount","Cess Amount"], Object.values(r1.hsnB2B).map(x => [x.hsn, x.desc, x.uqc, x.qty, r2(x.taxable+x.i+x.c+x.s), x.rate, x.taxable, x.i, x.c, x.s, 0])),
    hsnB2C: () => csvSave(`GSTR1 HSN B2C ${tag}.csv`, ["HSN","Description","UQC","Total Quantity","Total Value","Rate","Taxable Value","Integrated Tax Amount","Central Tax Amount","State/UT Tax Amount","Cess Amount"], Object.values(r1.hsnB2C).map(x => [x.hsn, x.desc, x.uqc, x.qty, r2(x.taxable+x.i+x.c+x.s), x.rate, x.taxable, x.i, x.c, x.s, 0])),
    docs: () => csvSave(`GSTR1 Documents ${tag}.csv`, ["Nature of Document","Sr. No. From","Sr. No. To","Total Number","Cancelled"], Object.values(r1.docs).map(x => ["Invoices for outward supply", x.from, x.to, x.total, x.cancelled])),
    pur: () => csvSave(`Purchase register ${tag}.csv`, ["Bill date","Bill no","Supplier","GSTIN","Taxable","IGST","CGST","SGST","Reverse charge","ITC"], g.reg.map(x => [dmy(x.d.date), x.d.no, x.d.party?.name, x.d.party?.gstin||"", x.taxable, x.i, x.c, x.s, x.d.rcm?"Y":"N", x.d.rcm?"RCM":x.ok?"Eligible":"No GSTIN"]))
  };
  m.querySelectorAll("[data-csv]").forEach(b => b.onclick = () => csv[b.dataset.csv]());
}

/* ---------- PDF ---------- */
async function saveFile(filename, blob){
  if (DL) {
    try { await DL.save({filename, data: blob}); toast("Saved"); }
    catch(e) { if (e && e.code !== "declined") toast("Download is not available here."); }
    return;
  }
  if (window.claude) { toast("Download is not available in this view."); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function downloadPDF(d){
  if (!window.jspdf) return toast("PDF tool did not load. Check your connection and reload.");
  try {
    const pdf = buildPDF(d);
    const name = `${TYPES[d.type].short} ${fileSafe(d.no)} ${fileSafe(d.party?.name||"")}.pdf`;
    saveFile(name, pdf.output("blob"));
  } catch(e) { console.error(e); toast("Could not make the PDF."); }
}
function buildPDF(d){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"mm", format:"a4"});
  const T = TYPES[d.type], c = calc(d), co = S.co, p = d.party || {}, isPur = d.type === "PUR";
  const RED = [196,22,28], L = 12, R = 198, W = R - L;
  const rs = n => "Rs. " + fmt(n);
  const tx = (s, x, y, o={}) => pdf.text(String(s ?? ""), x, y, o);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(20);
  const title = d.type === "INV" ? "TAX INVOICE" : d.type === "QTN" ? "QUOTATION" : "PURCHASE BILL";
  tx(title, L, 12);
  if (d.cancelled) { pdf.setTextColor(...RED); pdf.setFontSize(26); pdf.text("CANCELLED", 105, 150, {align:"center", angle:30}); pdf.setFontSize(10); pdf.setTextColor(20); }
  const tag = d.type==="INV" ? "ORIGINAL FOR RECIPIENT" : isPur ? "PURCHASE RECORD" : "ESTIMATE";
  const tw = pdf.getTextWidth(title);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(130);
  const gw = pdf.getTextWidth(tag) + 4; pdf.setDrawColor(150); pdf.rect(L + tw + 3, 8.6, gw, 4.8); tx(tag, L + tw + 5, 12);
  let y = 18;
  if (isPur) {
    pdf.setFont("helvetica","bold"); pdf.setFontSize(17); pdf.setTextColor(...RED); tx(p.name, L, y + 6);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(30);
    let yy = y + 12; pdf.splitTextToSize(p.address||"", W).forEach(s => { tx(s, L, yy); yy += 4.2; });
    if (p.gstin) { tx("GSTIN: " + p.gstin, L, yy); yy += 4.2; }
    y = Math.max(yy, y + 18);
  } else {
    try { pdf.addImage(LOGO, "JPEG", L + 3, y, 28, 30); } catch(e) {}
    const x = L + 38;
    pdf.setFont("helvetica","bold"); pdf.setFontSize(19); pdf.setTextColor(...RED); tx(co.name, x, y + 8);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(30);
    let yy = y + 14; pdf.splitTextToSize(co.address||"", R - x).forEach(s => { tx(s, x, yy); yy += 4.2; });
    yy += 0.8;
    const kv = (k, v, xx) => { pdf.setFont("helvetica","bold"); tx(k, xx, yy); const kw = pdf.getTextWidth(k + " "); pdf.setFont("helvetica","normal"); tx(v, xx + kw, yy); return xx + kw + pdf.getTextWidth(v) + 7; };
    let xx = kv("Mobile:", co.mobile, x); xx = kv("GSTIN:", co.gstin, xx); kv("PAN Number:", co.pan, xx); yy += 4.4;
    kv("Email:", co.email, x); yy += 4;
    y = Math.max(yy, y + 32);
  }
  pdf.setFillColor(...RED); pdf.rect(L, y, W, 2, "F"); y += 2;
  pdf.setFillColor(230,230,230); pdf.rect(L, y, W, 10, "F");
  pdf.setFontSize(9.5); pdf.setTextColor(20);
  const band = (k, v, xx, align) => { pdf.setFont("helvetica","bold"); const s = k + " "; if (align === "right") { pdf.setFont("helvetica","normal"); const vw = pdf.getTextWidth(v); tx(v, xx, y + 6.4, {align:"right"}); pdf.setFont("helvetica","bold"); tx(s, xx - vw, y + 6.4, {align:"right"}); } else { tx(s, xx, y + 6.4); const kw = pdf.getTextWidth(s); pdf.setFont("helvetica","normal"); tx(v, xx + kw, y + 6.4); } };
  band(T.noLabel + ":", d.no, L + 4);
  band((d.type === "QTN" ? "Date" : T.dateLabel) + ":", dmy(d.date), L + 76);
  if (d.due) band(T.due + ":", dmy(d.due), R - 4, "right");
  y += 16;
  const block = (label, x, o, width) => {
    let yy = y; pdf.setFont("helvetica","normal"); pdf.setFontSize(9.5); pdf.setTextColor(20); tx(label, x, yy); yy += 6;
    pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.splitTextToSize(o.name||"", width).forEach(s => { tx(s, x, yy); yy += 4.6; });
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
    pdf.splitTextToSize(o.address||"", width).forEach(s => { tx(s, x, yy); yy += 4.2; });
    if (o.gstin) { tx("GSTIN:   " + o.gstin, x, yy); yy += 4.2; }
    if (o.pan) { tx("PAN Number:  " + o.pan, x, yy); yy += 4.2; }
    if (o.pos) { tx("Place of Supply:  " + o.pos, x, yy); yy += 4.2; }
    return yy;
  };
  let y1, y2 = y;
  if (isPur) { y1 = block("BILLED TO (US)", L, {name:co.name, address:co.address, gstin:co.gstin}, 88); if (d.ref) y2 = block("OUR ENTRY REF.", L + 98, {name:d.ref}, 88); }
  else {
    y1 = block(T.partyLabel.toUpperCase(), L, {...p, pos:d.pos}, 88);
    if (d.type === "INV" || d.shipSame === false) { const ship = d.shipSame !== false ? {name:p.name, address:p.address} : {name:d.shipName, address:d.shipAddress}; y2 = block("SHIP TO", L + 98, ship, 88); }
  }
  y = Math.max(y1, y2) + 3;

  const showHsn = c.lines.some(l => l.hsn);
  const head = ["ITEMS", ...(showHsn ? ["HSN/SAC"] : []), "QTY.", "RATE", "TAX", "AMOUNT"];
  const body = c.lines.map(l => [ [l.name, ...(l.desc ? l.desc.split(/\n/) : [])].join("\n"), ...(showHsn ? [l.hsn] : []), `${fmt(l.qty)} ${l.unit||""}`.trim(), fmt(l.rate), `${fmt(l.tax)}\n(${fmt(l.gst)}%)`, fmt(l.total)]);
  body.push(["SUBTOTAL", ...(showHsn ? [""] : []), fmt(c.qty), "", rs(c.tax), rs(c.gross)]);
  const last = body.length - 1;
  const colStyles = {}; const n = head.length;
  colStyles[0] = {halign:"left", cellWidth:"auto"};
  for (let i = 1; i < n; i++) colStyles[i] = {halign:"right", cellWidth: i === n-1 ? 28 : (showHsn && i === 1 ? 20 : 24)};
  pdf.autoTable({
    startY: y, head: [head], body, theme: "plain", margin: {left: L, right: 210 - R},
    styles: {font:"helvetica", fontSize:8.6, textColor:20, cellPadding:{top:2.6,bottom:2.6,left:2.5,right:2.5}, valign:"top"},
    headStyles: {fontStyle:"normal", fontSize:9.5, halign:"right"},
    columnStyles: colStyles,
    didParseCell: h => { if (h.section === "head" && h.column.index === 0) h.cell.styles.halign = "left"; if (h.section === "body" && h.column.index === 0 && h.row.index !== last) h.cell.styles.fontSize = 9.5; if (h.section === "body" && h.row.index === last) h.cell.styles.fontStyle = "bold"; },
    willDrawCell: h => {
      if (h.section === "body" && h.row.index !== last && (h.column.index === 0 || h.column.index === n - 2)) { h.cell._lines = h.cell.text.slice(); h.cell.text = []; }
    },
    didDrawCell: h => {
      const cl = h.cell;
      if (h.section === "head" && h.column.index === 0) { pdf.setDrawColor(...RED); pdf.setLineWidth(0.6); pdf.line(L, cl.y, R, cl.y); pdf.line(L, cl.y + cl.height, R, cl.y + cl.height); }
      if (h.section === "body" && h.column.index === 0) {
        if (h.row.index === last) { pdf.setDrawColor(...RED); pdf.setLineWidth(0.6); pdf.line(L, cl.y, R, cl.y); pdf.line(L, cl.y + cl.height, R, cl.y + cl.height); }
        else { pdf.setDrawColor(221); pdf.setLineWidth(0.2); pdf.line(L, cl.y + cl.height, R, cl.y + cl.height); }
      }
      if (cl._lines && h.section === "body" && c.lines[h.row.index]) {
        const x0 = cl.x + cl.padding("left"), xr = cl.x + cl.width - cl.padding("right"); let yy = cl.y + cl.padding("top") + 2.9;
        if (h.column.index === 0) {
          // re-wrap: name on first line(s) in normal 9.5, description smaller
          const l = c.lines[h.row.index];
          pdf.setFont("helvetica","normal"); pdf.setFontSize(9.5); pdf.setTextColor(20);
          pdf.splitTextToSize(l.name, cl.width - 5).forEach(s => { pdf.text(s, x0, yy); yy += 4; });
          pdf.setFontSize(8); pdf.setTextColor(60);
          (l.desc ? l.desc.split(/\n/) : []).forEach(par => pdf.splitTextToSize(par, cl.width - 5).forEach(s => { pdf.text(s, x0, yy); yy += 3.6; }));
        } else {
          pdf.setFont("helvetica","normal"); pdf.setFontSize(8.6); pdf.setTextColor(20); pdf.text(cl._lines[0] || "", xr, yy, {align:"right"});
          pdf.setFontSize(7.5); pdf.setTextColor(120); pdf.text(cl._lines[1] || "", xr, yy + 3.6, {align:"right"});
        }
        pdf.setTextColor(20);
      }
    }
  });
  y = pdf.lastAutoTable.finalY + 6;
  const need = 60; if (y + need > 285) { pdf.addPage(); y = 16; }

  // totals (right) and bank (left)
  const taxRows = Object.entries(c.byRate).filter(([r]) => num(r) > 0).flatMap(([r,t]) => d.igst ? [[`IGST @${fmt(r)}%`, t]] : [[`CGST @${fmt(num(r)/2)}%`, r2(t/2)], [`SGST @${fmt(num(r)/2)}%`, r2(t - r2(t/2))]]);
  let yr = y; const xl = 128, xv = R;
  pdf.setFontSize(9.5); pdf.setTextColor(20); pdf.setFont("helvetica","normal");
  const trow = (k, v, bold) => { pdf.setFont("helvetica", bold ? "bold" : "normal"); tx(k, xv - 34, yr, {align:"right"}); tx(v, xv, yr, {align:"right"}); yr += 5.4; };
  trow("Taxable Amount", rs(c.taxable));
  taxRows.forEach(([k, v]) => trow(k, rs(v)));
  if (c.roundOff) trow("Round Off", (c.roundOff > 0 ? "+ " : "- ") + rs(Math.abs(c.roundOff)));
  pdf.setDrawColor(40); pdf.setLineWidth(0.3); pdf.line(xl, yr - 3.6, R, yr - 3.6);
  yr += 0.6; trow(d.rcm ? "Total (excl. RCM GST)" : "Total Amount", rs(c.total), true);
  pdf.line(xl, yr - 3.4, R, yr - 3.4); yr += 1.4;
  if (d.type !== "QTN") { trow((isPur ? "Paid" : "Received") + " Amount", rs(c.received)); if (c.received > 0) trow("Balance", rs(c.balance), true); }

  let yl = y;
  if (!isPur) {
    pdf.setFont("helvetica","bold"); pdf.setFontSize(9.5); tx("BANK DETAILS", L, yl); yl += 5.4;
    pdf.setFontSize(9.2);
    [["Name:", co.bankName], ["IFSC Code:", co.ifsc], ["Account No:", co.account], ["Bank:", co.bank]].forEach(([k, v]) => {
      pdf.setFont("helvetica","normal"); tx(k, L, yl); const ls = pdf.splitTextToSize(v||"", 64); ls.forEach((s, i) => tx(s, L + 30, yl + i * 4.2)); yl += 4.2 * ls.length + 1;
    });
  }
  y = Math.max(yl, yr) + 5;
  // terms (left) + words (right)
  const termsText = isPur ? (d.notes || "") : (d.terms || "") + (d.notes ? "\n\nNotes:\n" + d.notes : "");
  const tl = pdf.splitTextToSize(termsText, 98);
  if (y + Math.min(tl.length * 4 + 10, 60) > 285) { pdf.addPage(); y = 16; }
  let yt = y;
  if (termsText) {
    pdf.setFont("helvetica","bold"); pdf.setFontSize(9.5); tx(isPur ? "NOTES" : "TERMS AND CONDITIONS", L, yt); yt += 5.4;
    pdf.setFont("helvetica","normal"); pdf.setFontSize(8.8);
    tl.forEach(s => { if (yt > 287) { pdf.addPage(); yt = 16; } tx(s, L, yt); yt += 4; });
  }
  pdf.setFont("helvetica","bold"); pdf.setFontSize(9.5); tx("Total Amount (in words)", R, y, {align:"right"});
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9.2);
  let yw = y + 5.4; pdf.splitTextToSize(amountWords(c.total), 84).forEach(s => { tx(s, R, yw, {align:"right"}); yw += 4.2; });
  if (!isPur) {
    let ys = Math.max(yw + 14, Math.min(yt, 270) - 4); if (ys > 278) ys = 278;
    pdf.setFont("helvetica","bold"); tx("For " + co.name, R, ys, {align:"right"});
    pdf.setFont("helvetica","normal"); tx("Authorised Signatory", R, ys + 14, {align:"right"});
  }
  const pages = pdf.getNumberOfPages();
  if (pages > 1) for (let i = 1; i <= pages; i++) { pdf.setPage(i); pdf.setFontSize(7.5); pdf.setTextColor(140); tx(`${T.short} ${d.no} · Page ${i} of ${pages}`, R, 292, {align:"right"}); }
  return pdf;
}

/* ---------- ui bits ---------- */
let toastT;
function toast(msg){ let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function confirmBox(msg, okLabel){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div>${esc(msg)}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x="0">Cancel</button><button class="btn pri" data-x="1">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); res(v); };
    bg.addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (b) done(b.dataset.x === "1"); else if (e.target === bg) done(false); });
    bg.querySelector('[data-x="1"]').focus();
  });

const IDB_NAME = "rsf-billing-db", STORES = ["config","parties","items","docs"];
let IDB = null;
function idbOpen(){
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no indexedDB"));
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => { const d = r.result; STORES.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("blocked"));
  });
}
function idbWrite(ops){ // ops: [store, key, value|null]
  return new Promise((res, rej) => {
    const t = IDB.transaction([...new Set(ops.map(o => o[0]))], "readwrite");
    ops.forEach(([st, k, v]) => { const os = t.objectStore(st); v === null ? os.delete(k) : os.put(v, k); });
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
function idbReadAll(){
  return new Promise((res, rej) => {
    const t = IDB.transaction(STORES, "readonly"), out = {};
    STORES.forEach(st => { const os = t.objectStore(st), ks = os.getAllKeys(), vs = os.getAll(); t.addEventListener("complete", () => { const o = {}; ks.result.forEach((k, i) => o[k] = vs.result[i]); out[st] = o; }); });
    t.oncomplete = () => setTimeout(() => res(out)); t.onerror = () => rej(t.error);
  });
}
async function idbLoad(){
  const o = await idbReadAll();
  S.co = {...DEFAULT_CO, ...(o.config.company || {})}; S.parties = o.parties; S.items = o.items; S.docs = o.docs;
}

  const ops = [];
  if (src.co) ops.push(["config","company",src.co]);
  ["parties","items","docs"].forEach(c => Object.entries(src[c] || {}).forEach(([k, v]) => ops.push([c, k, v])));

}

async function boot(){
  if (window.claude && typeof window.claude.use === "function") {
    setSync("Connecting", false); render();
    let db = null;
    try { db = await window.claude.use("db"); } catch(e) {}
    try { DL = await window.claude.use("downloads"); } catch(e) {}
    if (db) {
      DB = db; MODE = "db";
      try { const u = await window.claude.use("user"); const w = u ? await u.can("data.write") : null; if (w === false) CANWRITE = false; } catch(e) {}
      const onErr = e => { setSync("Offline — reload to reconnect", false); };
      DB.doc("config/company").onSnapshot(s => { S.co = {...DEFAULT_CO, ...(s.exists ? s.data() : {})}; READY.company = true; softRender(); }, onErr);
      ["parties","items","docs"].forEach(col => DB.collection(col).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(x => o[x.id] = x.data()); S[col] = o; READY[col] = true;
        setSync(snap.metadata.fromCache ? "Syncing" : "Saved online", !snap.metadata.fromCache); softRender();
      }, onErr));
      return;
    }
    return startLocal();
  }
  try {
    const st = await api("status");
    if (typeof st.setup !== "boolean") throw new Error("no api");
    MODE = "server";
    if (st.setup) return renderAuth("setup");
    if (!st.user) return renderAuth("login");
    USER = st.user; await startServer();
  } catch(e) {
    if (MODE === "server") { setSync("Cannot reach server", false); toast("Could not load data from the server. Check your internet and reload."); return; }
    return startLocal();
  }
}
